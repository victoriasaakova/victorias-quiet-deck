<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Deck Prototype</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta
      name="description"
      content="A minimal interactive prototype for a metaphorical card deck."
    />
    <meta property="og:title" content="Victoria's Quiet Deck" />
    <meta
      property="og:description"
      content="A metaphorical card deck with questions for reflection."
    />
    <meta
      property="og:image"
      content="https://quietdeck.vercel.app/assets/images/og-image.jpg"
    />
    <meta
      property="og:url"
      content="https://quietdeck.vercel.app"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://quietdeck.vercel.app/assets/images/og-image.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <div class="page-grid" aria-hidden="true"></div>

      <header class="site-header">
        <div class="brand-block">
          <p class="eyebrow">victoria's</p>
          <h1>Quiet Deck</h1>
        </div>

        <button
          class="theme-toggle"
          type="button"
          aria-label="Toggle theme"
          data-theme-toggle
        >
          <span class="theme-toggle__label" data-theme-label>Dark</span>
        </button>
      </header>

      <main class="main-layout">
        <section class="card-stage" aria-live="polite">
          <div class="deck-stack" data-deck-stack>
            <div class="deck-stack__side deck-stack__side--left" aria-hidden="true">
              <div class="stack-card stack-card--back"></div>
              <div class="stack-card stack-card--preview" data-prev-preview>
                <div class="stack-card__visual" data-prev-visual></div>
              </div>
            </div>

            <article class="deck-card" data-card>
              <span class="deck-card__id" data-card-id>I</span>

              <div class="deck-card__visual-frame">
                <div class="deck-card__visual" data-card-visual aria-hidden="true">
                  <img
                    class="deck-card__image"
                    data-card-image
                    src="./assets/images/mirage-city.jpg"
                    alt=""
                  />
                </div>
              </div>

              <div class="deck-card__body">
                <h2 class="deck-card__title" data-card-title>Mirage City</h2>
                <p class="deck-card__prompt" data-card-prompt>
                  What are you projecting onto the place you want to reach?
                </p>
              </div>
            </article>

            <div class="deck-stack__side deck-stack__side--right" aria-hidden="true">
              <div class="stack-card stack-card--preview" data-next-preview>
                <div class="stack-card__visual" data-next-visual></div>
              </div>
              <div class="stack-card stack-card--back"></div>
            </div>
          </div>

          <div class="controls">
            <button class="draw-button" type="button" data-draw-card>Pick a card</button>
          </div>
        </section>
      </main>

      <footer class="site-footer" aria-label="Social links">
        <div class="site-footer__links">
          <a
            class="site-footer__link"
            href="https://t.me/victoriasnotion"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.73 3.27 2.89 10.15c-.81.32-.8 1.48.02 1.77l4.53 1.59 1.76 5.63c.24.76 1.2.93 1.68.29l2.55-3.39 4.98 3.67c.67.49 1.62.13 1.79-.69l2.74-13.44c.19-.95-.73-1.74-1.61-1.31ZM9.31 12.95l8.43-6.12-6.81 7.11a.75.75 0 0 0-.18.33l-.9 3.52-.54-4.21Zm1.33.82-1.95-1.4-3.32-1.17 12.17-4.7-6.9 7.27Z"
                fill="currentColor"
              />
            </svg>
          </a>
          <a
            class="site-footer__link"
            href="https://instagram.com/victori_s"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7.5 3h9A4.5 4.5 0 0 1 21 7.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 3 16.5v-9A4.5 4.5 0 0 1 7.5 3Zm0 1.5A3 3 0 0 0 4.5 7.5v9a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3v-9a3 3 0 0 0-3-3h-9Zm9.75 1.13a1.12 1.12 0 1 1 0 2.24 1.12 1.12 0 0 1 0-2.24ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"
                fill="currentColor"
              />
            </svg>
          </a>
          <a
            class="site-footer__link"
            href="https://www.linkedin.com/in/victoriasaakova/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5.5 8A1.5 1.5 0 1 0 5.5 5a1.5 1.5 0 0 0 0 3ZM4.25 9.5h2.5v9h-2.5v-9Zm4.5 0h2.39v1.23h.04c.33-.63 1.15-1.49 2.87-1.49 3.06 0 3.63 1.92 3.63 4.41v4.85h-2.5v-4.3c0-1.03-.02-2.36-1.51-2.36-1.52 0-1.75 1.13-1.75 2.28v4.38h-2.5v-9Z"
                fill="currentColor"
              />
            </svg>
          </a>
          <a
            class="site-footer__link"
            href="https://medium.com/@victoriss"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Medium"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 7.5c0-.24.09-.46.26-.62L5.7 5.5H1.5V6l1.3 1.57c.13.16.2.37.2.58v7.7c0 .22-.08.43-.23.6L1.5 18v.5h4.56V18l-1.27-1.54a.92.92 0 0 1-.24-.61V9.32l4.14 9.68h.47l3.56-9.68v7.52c0 .1-.04.2-.11.27l-.98.95v.44H17.5v-.44l-.94-.91a.38.38 0 0 1-.12-.28V7.12c0-.11.04-.21.12-.28L17.5 6v-.5h-4.12l-2.93 7.95L7.1 5.5H4v2Z"
                fill="currentColor"
              />
            </svg>
          </a>
        </div>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
