<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Deck Prototype</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta
      name="description"
      content="A minimal interactive prototype for a metaphorical card deck."
    />
    <meta property="og:title" content="Victoria's Quiet Deck" />
    <meta
      property="og:description"
      content="A metaphorical card deck with questions for reflection."
    />
    <meta
      property="og:image"
      content="https://quietdeck.vercel.app/assets/images/og-image.jpg"
    />
    <meta
      property="og:url"
      content="https://quietdeck.vercel.app"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://quietdeck.vercel.app/assets/images/og-image.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <div class="page-grid" aria-hidden="true"></div>

      <header class="site-header">
        <div class="brand-block">
          <p class="eyebrow">victoria's</p>
          <h1>Quiet Deck</h1>
        </div>

        <div
          class="header-actions"
          style="display: flex; align-items: center; gap: 8px;"
        >
          <button
            class="language-toggle"
            type="button"
            aria-label="Switch language to Russian"
            data-lang-toggle
          >
            EN
          </button>

          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
            data-theme-toggle
          >
            <span class="theme-toggle__label" data-theme-label>Dark</span>
          </button>
        </div>
      </header>

      <main class="main-layout">
        <section class="card-stage" aria-live="polite">
          <div class="deck-stack" data-deck-stack>
            <div class="deck-stack__side deck-stack__side--left" aria-hidden="true">
              <div class="stack-card stack-card--back"></div>
              <div class="stack-card stack-card--preview" data-prev-preview>
                <div class="stack-card__visual" data-prev-visual></div>
              </div>
            </div>

            <article class="deck-card" data-card>
              <span class="deck-card__id" data-card-id>I</span>

              <div class="deck-card__visual-frame">
                <div class="deck-card__visual" data-card-visual aria-hidden="true">
                  <img
                    class="deck-card__image"
                    data-card-image
                    src="./assets/images/mirage-city.jpg"
                    alt=""
                  />
                </div>
              </div>

              <div class="deck-card__body">
                <h2 class="deck-card__title" data-card-title>Mirage City</h2>
                <p class="deck-card__prompt" data-card-prompt>
                  What are you projecting onto the place you want to reach?
                </p>
              </div>
            </article>

            <div class="deck-stack__side deck-stack__side--right" aria-hidden="true">
              <div class="stack-card stack-card--preview" data-next-preview>
                <div class="stack-card__visual" data-next-visual></div>
              </div>
              <div class="stack-card stack-card--back"></div>
            </div>
          </div>

          <div class="controls">
            <button class="draw-button" type="button" data-draw-card>Pick a Card</button>
          </div>
        </section>
      </main>

      <footer class="site-footer" aria-label="Social links">
        <div class="site-footer__links">
          <a
            class="site-footer__link"
            href="https://t.me/victoriasnotion"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram"
          >
            <iconify-icon icon="simple-icons:telegram" aria-hidden="true"></iconify-icon>
          </a>
          <a
            class="site-footer__link"
            href="https://instagram.com/victori_s"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <iconify-icon icon="simple-icons:instagram" aria-hidden="true"></iconify-icon>
          </a>
          <a
            class="site-footer__link"
            href="https://www.linkedin.com/in/victoriasaakova/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <iconify-icon icon="simple-icons:linkedin" aria-hidden="true"></iconify-icon>
          </a>
          <a
            class="site-footer__link"
            href="https://medium.com/@victoriss"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Medium"
          >
            <iconify-icon icon="simple-icons:medium" aria-hidden="true"></iconify-icon>
          </a>
        </div>
      </footer>
    </div>

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
